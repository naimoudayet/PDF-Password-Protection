name: pdfpwd-20

services:
  db:
    image: postgres:16
    container_name: pdfpwd-pg-20
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    container_name: pdfpwd-odoo-20
    depends_on:
      - db
    ports:
      - "1820:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # the addons are bind-mounted, so without this Odoo writes __pycache__
      # directories straight into the working tree and they end up committed
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - odoo-data:/var/lib/odoo
      - ./no_pdf_password_protection:/mnt/extra-addons/no_pdf_password_protection
      - ./no_pdf_password_protection_account:/mnt/extra-addons/no_pdf_password_protection_account
    # Odoo 20 listens on 127.0.0.1 by default; bind all interfaces so the port works
    command: ["odoo", "--http-interface=0.0.0.0"]

volumes:
  db-data:
  odoo-data:
