# OCA-derived ESLint config for OWL / ES2022 modules (static/src/**/*.js).
# static/description/ is excluded via .eslintignore + the pre-commit exclude.
ignorePatterns:
  - "static/description/**"
parserOptions:
  ecmaVersion: 2022
  sourceType: module
env:
  browser: true
  es2022: true
globals:
  odoo: readonly
  owl: readonly
  $: readonly
  luxon: readonly
  _t: readonly
rules:
  no-undef: error
  no-unused-vars: warn
  no-debugger: error
  no-alert: error
  prefer-const: warn
  no-restricted-globals:
    - error
    - event
    - self
