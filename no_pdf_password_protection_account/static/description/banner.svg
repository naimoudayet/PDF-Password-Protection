<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#714B67"/>
      <stop offset="100%" stop-color="#5A3A52"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#00A09D"/>

  <text x="100" y="98"  fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="3">ODOO MODULE</text>

  <text x="100" y="240" fill="#FFFFFF" font-size="80" font-weight="800" letter-spacing="-1">Protected Invoices,</text>
  <text x="100" y="336" fill="#FF7F4F" font-size="80" font-weight="800" letter-spacing="-1">Emailed Too.</text>

  <text x="100" y="412" fill="#FFFFFF" font-size="26" font-weight="500">The invoice you send is locked, not just the one you print.</text>
  <text x="100" y="450" fill="#BBA8B5" font-size="20" font-weight="400">Every customer's copy carries that customer's own password. Installs itself.</text>

  <line x1="100" y1="510" x2="1180" y2="510" stroke="#8A6A80" stroke-width="1" opacity="0.6"/>

  <g font-size="16" font-weight="700" letter-spacing="2">
    <text x="100" y="560" fill="#FFFFFF">SEND &amp; PRINT</text>
    <text x="255" y="560" fill="#8A6A80">&#183;</text>
    <text x="280" y="560" fill="#FFFFFF">PER CUSTOMER</text>
    <text x="475" y="560" fill="#8A6A80">&#183;</text>
    <text x="500" y="560" fill="#FFFFFF">AUTO-INSTALLS</text>
  </g>

  <g font-size="16" font-weight="700" letter-spacing="2">
    <text x="1180" y="560" fill="#FF7F4F" text-anchor="end">LGPL-3 &#183; FREE</text>
  </g>
</svg>
