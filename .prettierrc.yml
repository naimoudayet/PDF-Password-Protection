# OCA-derived prettier config - JS / SCSS only (static/description/ excluded in
# .pre-commit-config.yaml). endOfLine matches the repo's stored blobs (§15.5).
# bracketSpacing and tabWidth match Odoo core JS style (`import { patch }`,
# 4-space indent). Prettier defaults tabWidth to 2, so it MUST be stated:
# without it a `pre-commit run -a` reindents every OWL file in the addon.
bracketSpacing: true
printWidth: 88
tabWidth: 4
proseWrap: always
semi: true
trailingComma: all
endOfLine: lf
# No XML plugin: the archived mirrors-prettier cannot resolve it (prettier looks
# for plugins relative to the CWD, not the hook env), and reflowing hand-written
# view XML gains nothing. XML is covered by oca-checks-odoo-module.
