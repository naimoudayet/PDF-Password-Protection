# OCA-derived prettier config — JS / SCSS only (static/description/ excluded in
# .pre-commit-config.yaml). endOfLine: lf matches the repo blobs (§15.5).
bracketSpacing: false
printWidth: 88
proseWrap: always
semi: true
trailingComma: all
endOfLine: lf
plugins:
  - "@prettier/plugin-xml"
xmlWhitespaceSensitivity: ignore
overrides:
  - files: "*.xml"
    options:
      parser: xml
