# OCA-derived pre-commit pipeline — ODOO_GUIDELINES §15.
# Code-quality only: the hand-authored storefront (static/description/) is
# EXCLUDED from every formatter (§15.1), and there is no oca-gen-addon-readme
# hook (the custom README/index.html is authoritative).
# `rev:` pins should be synced to the OCA tool branch for the 19.0 series.
exclude: |
    (?x)
    # Vendored third-party libraries - ship them exactly as published upstream
    /static/src/lib/|
    (^|/)[^/]*\.min\.(js|css)$|
    # Hand-authored App Store listing — never reformat (breaks §2.0 sanitizer rules)
    /static/description/|
    # gettext template
    ^.*\.pot$
default_language_version:
    python: python3
    node: "18.17.1"
repos:
    - repo: https://github.com/oca/maintainer-tools
      rev: f9e5ae4c4cb6f540ace14c5c265a59c352a7f22a
      hooks:
          - id: oca-fix-manifest-website
            args: ["https://www.oudayet.com"]
          # oca-gen-addon-readme INTENTIONALLY OMITTED — custom README (§5 / §15.1)
    - repo: https://github.com/OCA/odoo-pre-commit-hooks
      rev: v0.0.33
      hooks:
          - id: oca-checks-odoo-module
            # These contradict the portfolio's own rules: GL 15.1 keeps a
            # hand-authored README.md, GL 4 states manifest keys explicitly.
            args:
                - "--disable=use-header-comments,manifest-superfluous-key,prefer-env-translation,prefer-readme-rst,missing-readme"
          - id: oca-checks-po
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: trailing-whitespace
            exclude: /static/description/
          - id: end-of-file-fixer
            exclude: /static/description/
          - id: check-merge-conflict
          - id: check-yaml
          - id: check-added-large-files
            args: ["--maxkb=300"]
          - id: mixed-line-ending
            args: ["--fix=lf"] # LF repo (§15.5) — match existing blobs
    - repo: https://github.com/psf/black
      rev: 24.4.2
      hooks:
          - id: black
    - repo: https://github.com/PyCQA/isort
      rev: 5.13.2
      hooks:
          - id: isort
            name: isort
    - repo: https://github.com/PyCQA/flake8
      rev: 7.1.0
      hooks:
          - id: flake8
            additional_dependencies: ["flake8-bugbear==24.4.26"]
    - repo: https://github.com/asottile/pyupgrade
      rev: v3.21.2
      hooks:
          - id: pyupgrade
            args: ["--py310-plus"]
    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.1.0
      hooks:
          - id: prettier
            additional_dependencies:
                - "prettier@3.3.3"
                - "@prettier/plugin-xml@3.4.1"
            exclude: '(/static/description/|\.md$)' # storefront HTML + hand-authored markdown (GL 15.1)
    - repo: local
      hooks:
          - id: pylint-odoo
            name: pylint-odoo
            entry: python -m pylint
            language: system
            files: \.py$
            args: ["--rcfile=.pylintrc-mandatory", "--load-plugins=pylint_odoo"]
